<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobTrackr — Application Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#2a2a3a;--accent:#7c6aff;--accent2:#ff6a9e;--green:#4ade80;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;--text:#f0f0ff;--muted:#6b6b8a;--font:'Syne',sans-serif;--mono:'DM Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(124,106,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(124,106,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
  .container{max-width:1200px;margin:0 auto;padding:2rem 1.5rem;position:relative;z-index:1}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2.5rem;flex-wrap:wrap;gap:1rem}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .logo-text{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .logo-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:2rem}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.25rem;position:relative;overflow:hidden}
  .stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
  .stat-card.total::after{background:var(--accent)}.stat-card.applied::after{background:var(--blue)}.stat-card.interview::after{background:var(--yellow)}.stat-card.offer::after{background:var(--green)}.stat-card.rejected::after{background:var(--red)}
  .stat-num{font-size:32px;font-weight:800;font-family:var(--mono);line-height:1;margin-bottom:4px}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .controls{display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
  .btn{padding:9px 18px;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
  .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#6a58ff;transform:translateY(-1px)}
  .btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
  .search-box{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-family:var(--font);font-size:13px;outline:none}
  .search-box:focus{border-color:var(--accent)}.search-box::placeholder{color:var(--muted)}
  select.filter{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;cursor:pointer}
  select.filter:focus{border-color:var(--accent)}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead{background:var(--surface2)}
  th{padding:12px 16px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--accent)}
  td{padding:13px 16px;font-size:13px;border-top:1px solid var(--border);vertical-align:middle}
  tr:hover td{background:rgba(124,106,255,.04)}
  .company-name{font-weight:700}.role-loc{color:var(--muted);font-size:12px;margin-top:2px}
  .date{font-family:var(--mono);font-size:12px;color:var(--muted)}.salary{font-family:var(--mono);font-size:12px;color:var(--green)}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .badge.applied{background:rgba(96,165,250,.15);color:var(--blue)}.badge.interview{background:rgba(251,191,36,.15);color:var(--yellow)}.badge.offer{background:rgba(74,222,128,.15);color:var(--green)}.badge.rejected{background:rgba(248,113,113,.15);color:var(--red)}.badge.ghosted{background:rgba(107,107,138,.15);color:var(--muted)}.badge.saved{background:rgba(124,106,255,.15);color:var(--accent)}
  .priority{width:8px;height:8px;border-radius:50%;display:inline-block}
  .priority.high{background:var(--red);box-shadow:0 0 6px var(--red)}.priority.medium{background:var(--yellow)}.priority.low{background:var(--muted)}
  .action-btn{padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font);transition:all .12s;margin-right:4px}
  .action-btn:hover{border-color:var(--accent);color:var(--accent)}.action-btn.del:hover{border-color:var(--red);color:var(--red)}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:1rem}
  .modal-overlay.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2rem;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;animation:slideUp .2s ease}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .modal-title{font-size:20px;font-weight:800;margin-bottom:1.5rem}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .form-group{display:flex;flex-direction:column;gap:6px}.form-group.full{grid-column:1/-1}
  label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:80px}
  .modal-actions{display:flex;gap:.75rem;margin-top:1.5rem;justify-content:flex-end}
  .empty{text-align:center;padding:4rem 2rem;color:var(--muted)}
  .empty-icon{font-size:48px;margin-bottom:1rem;opacity:.5}
  .tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-size:10px;color:var(--muted);font-family:var(--mono)}
  .progress-wrap{margin-bottom:2rem}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
  .progress-bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;display:flex;gap:2px}
  .progress-seg{height:100%;border-radius:99px;transition:width .4s ease}
  @media(max-width:700px){.form-grid{grid-template-columns:1fr}td:nth-child(4),th:nth-child(4),td:nth-child(5),th:nth-child(5){display:none}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">💼</div>
      <div><div class="logo-text">JobTrackr</div><div class="logo-sub">Application Command Center</div></div>
    </div>
    <button class="btn btn-primary" onclick="openModal()">+ Add Application</button>
  </header>
  <div class="stats" id="stats"></div>
  <div class="progress-wrap">
    <div class="progress-label"><span>Pipeline Overview</span><span id="rate">0% success rate</span></div>
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <div class="controls">
    <input class="search-box" type="text" placeholder="🔍  Search company, role, location..." id="search" oninput="renderTable()">
    <select class="filter" id="statusFilter" onchange="renderTable()">
      <option value="">All Status</option><option value="saved">Saved</option><option value="applied">Applied</option><option value="interview">Interview</option><option value="offer">Offer</option><option value="rejected">Rejected</option><option value="ghosted">Ghosted</option>
    </select>
    <select class="filter" id="priorityFilter" onchange="renderTable()">
      <option value="">All Priority</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
    </select>
    <button class="btn btn-outline" onclick="exportCSV()">↓ Export CSV</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th onclick="sortBy('company')">Company ↕</th><th onclick="sortBy('role')">Role ↕</th><th onclick="sortBy('status')">Status ↕</th><th onclick="sortBy('date')">Applied ↕</th><th onclick="sortBy('salary')">Salary ↕</th><th>Priority</th><th>Source</th><th>Actions</th>
      </tr></thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="empty" id="empty-state" style="display:none"><div class="empty-icon">📋</div><div>No applications yet. Add your first one!</div></div>
  </div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">New Application</div>
    <div class="form-grid">
      <div class="form-group"><label>Company *</label><input type="text" id="f-company" placeholder="e.g. Google"></div>
      <div class="form-group"><label>Role *</label><input type="text" id="f-role" placeholder="e.g. Frontend Engineer"></div>
      <div class="form-group"><label>Status</label><select id="f-status"><option value="saved">Saved</option><option value="applied" selected>Applied</option><option value="interview">Interview</option><option value="offer">Offer</option><option value="rejected">Rejected</option><option value="ghosted">Ghosted</option></select></div>
      <div class="form-group"><label>Priority</label><select id="f-priority"><option value="high">🔴 High</option><option value="medium" selected>🟡 Medium</option><option value="low">⚫ Low</option></select></div>
      <div class="form-group"><label>Date Applied</label><input type="date" id="f-date"></div>
      <div class="form-group"><label>Salary Range</label><input type="text" id="f-salary" placeholder="e.g. $80k–$100k"></div>
      <div class="form-group"><label>Location</label><input type="text" id="f-location" placeholder="e.g. Remote / NYC"></div>
      <div class="form-group"><label>Source</label><select id="f-source"><option>LinkedIn</option><option>Indeed</option><option>Referral</option><option>Company Site</option><option>Glassdoor</option><option>Twitter/X</option><option>Other</option></select></div>
      <div class="form-group full"><label>Job URL</label><input type="url" id="f-url" placeholder="https://..."></div>
      <div class="form-group full"><label>Notes</label><textarea id="f-notes" placeholder="Interview rounds, contacts, follow-up dates..."></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveApp()">Save Application</button>
    </div>
  </div>
</div>
<script>
let apps=JSON.parse(localStorage.getItem('jobtrackr')||'[]');
let editId=null,sortKey='date',sortDir=-1;
if(apps.length===0){apps=[{id:1,company:'Stripe',role:'Frontend Engineer',status:'interview',date:'2025-04-15',salary:'$120k–$150k',location:'Remote',source:'LinkedIn',url:'',notes:'Round 2 scheduled',priority:'high'},{id:2,company:'Notion',role:'Product Designer',status:'applied',date:'2025-04-20',salary:'$90k–$110k',location:'NYC',source:'Company Site',url:'',notes:'',priority:'medium'},{id:3,company:'Vercel',role:'DevRel Engineer',status:'offer',date:'2025-04-10',salary:'$130k–$160k',location:'Remote',source:'Referral',url:'',notes:'Offer deadline: May 5',priority:'high'},{id:4,company:'Figma',role:'UX Engineer',status:'rejected',date:'2025-04-05',salary:'$110k',location:'SF',source:'LinkedIn',url:'',notes:'No feedback given',priority:'medium'},{id:5,company:'Linear',role:'Full Stack Dev',status:'ghosted',date:'2025-03-28',salary:'$100k+',location:'Remote',source:'Twitter/X',url:'',notes:'No response after 3 weeks',priority:'low'}];save();}
function save(){localStorage.setItem('jobtrackr',JSON.stringify(apps));}
function renderStats(){
  const c={total:apps.length,applied:0,interview:0,offer:0,rejected:0};
  apps.forEach(a=>{if(a.status==='applied'||a.status==='saved')c.applied++;if(a.status==='interview')c.interview++;if(a.status==='offer')c.offer++;if(a.status==='rejected')c.rejected++;});
  const rate=apps.length?Math.round((c.offer/apps.length)*100):0;
  document.getElementById('rate').textContent=`${rate}% success rate`;
  document.getElementById('stats').innerHTML=`<div class="stat-card total"><div class="stat-num" style="color:var(--accent)">${c.total}</div><div class="stat-label">Total Tracked</div></div><div class="stat-card applied"><div class="stat-num" style="color:var(--blue)">${c.applied}</div><div class="stat-label">Applied/Saved</div></div><div class="stat-card interview"><div class="stat-num" style="color:var(--yellow)">${c.interview}</div><div class="stat-label">Interview</div></div><div class="stat-card offer"><div class="stat-num" style="color:var(--green)">${c.offer}</div><div class="stat-label">Offers</div></div><div class="stat-card rejected"><div class="stat-num" style="color:var(--red)">${c.rejected}</div><div class="stat-label">Rejected</div></div>`;
  const total=apps.length||1;
  document.getElementById('progress-bar').innerHTML=[{p:c.applied/total,col:'var(--blue)'},{p:c.interview/total,col:'var(--yellow)'},{p:c.offer/total,col:'var(--green)'},{p:c.rejected/total,col:'var(--red)'}].map(s=>`<div class="progress-seg" style="width:${s.p*100}%;background:${s.col}"></div>`).join('');
}
function renderTable(){
  const q=document.getElementById('search').value.toLowerCase();
  const sf=document.getElementById('statusFilter').value;
  const pf=document.getElementById('priorityFilter').value;
  let filtered=apps.filter(a=>(a.company+a.role+(a.location||'')).toLowerCase().includes(q)&&(sf?a.status===sf:true)&&(pf?a.priority===pf:true));
  filtered.sort((a,b)=>{let av=a[sortKey]||'',bv=b[sortKey]||'';return av<bv?-sortDir:av>bv?sortDir:0;});
  const tbody=document.getElementById('table-body'),empty=document.getElementById('empty-state');
  if(!filtered.length){tbody.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  tbody.innerHTML=filtered.map(a=>`<tr><td><div class="company-name">${a.company}</div><div class="role-loc">${a.location||''}</div></td><td>${a.role}${a.url?`<br><a href="${a.url}" target="_blank" style="font-size:11px;color:var(--accent);text-decoration:none">↗ Link</a>`:''}</td><td><span class="badge ${a.status}">${a.status}</span></td><td class="date">${a.date||'—'}</td><td class="salary">${a.salary||'—'}</td><td><span class="priority ${a.priority}"></span></td><td><span class="tag">${a.source||'—'}</span></td><td><button class="action-btn" onclick="openModal(${a.id})">Edit</button><button class="action-btn del" onclick="deleteApp(${a.id})">Del</button></td></tr>`).join('');
}
function sortBy(key){sortKey===key?sortDir*=-1:(sortKey=key,sortDir=1);renderTable();}
function openModal(id=null){
  editId=id;
  document.getElementById('modal-title').textContent=id?'Edit Application':'New Application';
  const today=new Date().toISOString().split('T')[0];
  if(id){const a=apps.find(x=>x.id===id);document.getElementById('f-company').value=a.company;document.getElementById('f-role').value=a.role;document.getElementById('f-status').value=a.status;document.getElementById('f-priority').value=a.priority;document.getElementById('f-date').value=a.date;document.getElementById('f-salary').value=a.salary;document.getElementById('f-location').value=a.location;document.getElementById('f-source').value=a.source;document.getElementById('f-url').value=a.url;document.getElementById('f-notes').value=a.notes;}
  else{['f-company','f-role','f-salary','f-location','f-url','f-notes'].forEach(i=>document.getElementById(i).value='');document.getElementById('f-status').value='applied';document.getElementById('f-priority').value='medium';document.getElementById('f-date').value=today;document.getElementById('f-source').value='LinkedIn';}
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');editId=null;}
function saveApp(){
  const company=document.getElementById('f-company').value.trim(),role=document.getElementById('f-role').value.trim();
  if(!company||!role){alert('Company and Role are required!');return;}
  const data={company,role,status:document.getElementById('f-status').value,priority:document.getElementById('f-priority').value,date:document.getElementById('f-date').value,salary:document.getElementById('f-salary').value,location:document.getElementById('f-location').value,source:document.getElementById('f-source').value,url:document.getElementById('f-url').value,notes:document.getElementById('f-notes').value};
  if(editId){const idx=apps.findIndex(a=>a.id===editId);apps[idx]={...apps[idx],...data};}else{apps.push({id:Date.now(),...data});}
  save();renderStats();renderTable();closeModal();
}
function deleteApp(id){if(!confirm('Delete this application?'))return;apps=apps.filter(a=>a.id!==id);save();renderStats();renderTable();}
function exportCSV(){const h=['Company','Role','Status','Date','Salary','Location','Source','Priority','Notes'];const r=apps.map(a=>[a.company,a.role,a.status,a.date,a.salary,a.location,a.source,a.priority,a.notes].map(v=>`"${v||''}"`).join(','));const csv=[h.join(','),...r].join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='job-applications.csv';a.click();}
renderStats();renderTable();
</script>
</body>
</html>
